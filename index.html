<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Club Checker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>
<body class="bg-light">
    <nav class="navbar bg-primary">
        <div class="container">
            <span class="navbar-brand text-white fw-bold">ICT Club</span>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="card-title text-center mb-1">Candidate Verification</h3>
                        <p class="text-center text-muted mb-4">Enter your name to check if you made it.</p>

                        <div class="mb-3">
                            <label for="first-name" class="form-label">First Name</label>
                            <input type="text" id="first-name" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label for="last-name" class="form-label">Last Name</label>
                            <input type="text" id="last-name" class="form-control">
                        </div>
                        <button class="btn btn-primary w-100" py-click="check_name">Check</button>

                        <div id="result" class="alert alert-secondary text-center mt-4 mb-0">Result will appear here.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center text-muted py-3">&copy; 2026 ICT Club &middot; Seatwork 1 &middot; 2nd Quarter</footer>

    <script type="py" src="main.py"></script>
</body>
</html>
